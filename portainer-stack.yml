# openGym (personal fork) for Portainer on OpenMediaVault, reached over Tailscale.
#
# Deploy as a Portainer *Repository* stack (Stacks → Add stack → Repository) pointing at your
# fork, compose path `portainer-stack.yml`. Portainer clones the repo and builds both images on
# the box. Full walkthrough: FORK-SETUP.md.
#
# Set these under "Environment variables" in Portainer:
#   TS_AUTHKEY      a Tailscale auth key (admin console → Settings → Keys)
#   TS_TAILNET      your tailnet's DNS name, e.g. tail1a2b3c.ts.net (admin console → DNS)
#   DATA_PATH       where the data lives on the box, e.g. /srv/dev-disk-by-uuid-xxxx/appdata/opengym
# Optional:
#   TS_HOSTNAME     the machine name on your tailnet (default opengym → https://opengym.<tailnet>)
#   LAN_PORT        also serve on http://<omv-ip>:<port> at home (default 8085; passkeys need HTTPS,
#                   so use the Tailscale address for signing in)
#   API_TARGET      default (Anthropic API key) or coach (adds the Claude Agent SDK, for a
#                   Claude subscription via `claude setup-token`)
#   FOOD_COUNTRY    two-letter country searched first for foods (default za)

name: opengym

services:
  api:
    build:
      context: ./api
      target: ${API_TARGET:-default}
    image: opengym-fork-api:local
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - TRUST_PROXY=1
      - RP_ID=${TS_HOSTNAME:-opengym}.${TS_TAILNET}
      - ORIGIN=https://${TS_HOSTNAME:-opengym}.${TS_TAILNET}
      - RP_NAME=openGym
      # The first profile created becomes the admin (needed to switch the AI Coach on).
      - FIRST_USER_ADMIN=1
      # Name-and-password sign-in next to passkeys: handy for the LAN address and old devices.
      - PASSWORD_LOGIN=${PASSWORD_LOGIN:-1}
      - ALLOW_GUEST=0
      - FOOD_COUNTRY=${FOOD_COUNTRY:-za}
    volumes:
      - ${DATA_PATH:?set DATA_PATH}/data:/data
      - ${DATA_PATH:?set DATA_PATH}/coach-auth:/coach-auth

  # Tailscale sidecar: gives the app its own name on your tailnet with a real HTTPS certificate
  # (https://opengym.<tailnet>.ts.net), which passkeys, the camera (barcode scanning) and the
  # home-screen app all need. Nothing is exposed to the internet: Funnel stays off.
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-opengym}
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?set TS_AUTHKEY}
      - TS_HOSTNAME=${TS_HOSTNAME:-opengym}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - ${DATA_PATH:?set DATA_PATH}/tailscale:/var/lib/tailscale
      - ./deploy/tailscale:/config:ro
    ports:
      # The web container shares this network namespace, so its LAN port is published here.
      - "${LAN_PORT:-8085}:80"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: opengym-fork-web:local
    restart: unless-stopped
    depends_on:
      - api
      - tailscale
    # Shares the Tailscale container's network, so `tailscale serve` reaches nginx on 127.0.0.1:80
    # and nginx still reaches the api by its service name.
    network_mode: service:tailscale
    environment:
      - NGINX_PORT=80
      - BACKEND=api
      - PORT=3000
      - RESOLVER=127.0.0.11
